name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The live-server floor the gating jobs and the windows job run against: the
# tag the v1.10.0 release notes promise and the commit it named when pinned.
# The tag is lightweight and could move, so the checkouts take the commit and
# a step checks that the tag still names it and that tests/helpers.lua's
# H.live_server_floor names the same tag; the floor moves by editing these
# two lines and that one together. live-server main is the upstream job's to
# report.
env:
  LIVE_SERVER_FLOOR: v1.5.0
  LIVE_SERVER_FLOOR_SHA: f98bae79fd30274524412f7514549d84391d6bb2

concurrency:
  # A PR's superseded run is cancelled; a push and a manual run each get
  # their own group, so no verdict on main is ever cancelled or replaced
  # (GitHub replaces a pending run in a shared group even with
  # cancel-in-progress false).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.nvim }}, live-server floor)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selimacerbas/live-server.nvim
          ref: ${{ env.LIVE_SERVER_FLOOR_SHA }}
          path: live-server-rtp
          persist-credentials: false
      # A moved tag is the supply-chain event this step surfaces: the checkout
      # took the pinned commit, and the tag must still name it. The helper's
      # floor assignment, matched as a whole line, must name the same tag, so a
      # bump that edits one place reds even with the old line left in a comment.
      - name: live-server floor is the pinned tag
        run: |
          if ! grep -qxF "H.live_server_floor = \"$LIVE_SERVER_FLOOR\"" tests/helpers.lua; then
            echo "::error::tests/helpers.lua's H.live_server_floor does not name $LIVE_SERVER_FLOOR"
            exit 1
          fi
          git -C live-server-rtp fetch --depth 1 origin "refs/tags/$LIVE_SERVER_FLOOR:refs/tags/$LIVE_SERVER_FLOOR"
          tagged=$(git -C live-server-rtp rev-parse "$LIVE_SERVER_FLOOR^{commit}")
          if [ "$tagged" != "$LIVE_SERVER_FLOOR_SHA" ]; then
            echo "::error::live-server $LIVE_SERVER_FLOOR names $tagged, not the pinned $LIVE_SERVER_FLOOR_SHA"
            exit 1
          fi
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Version
        run: nvim --version | head -n 3
      # Release builds bundle the markdown parser since 0.10, so this asserts
      # it instead of installing it; a -c Lua error alone would exit 0, so the
      # pcall covers the vim.treesitter lookup as well as the call.
      - name: Assert the markdown Tree-sitter parser
        run: >-
          nvim --headless -u NONE
          -c 'lua local ok, p = pcall(function() return vim.treesitter.get_string_parser("# x", "markdown") end);
          if not (ok and p) then io.stderr:write("markdown parser missing\n"); vim.cmd("cq 1") end'
          -c 'qa!'
      # -l exits 1 on a Lua error in the main chunk, where the luafile form the
      # tests once documented exited 0; a failed assertion and an error raised
      # in a callback reach the exit code through H.finish() (tests/helpers.lua).
      - name: Headless tests
        run: bash tests/run.sh

  # The floor this plugin requires (the README states it from the floor
  # commit on): the first 0.10 release, not its last patch.
  floor:
    name: floor (ubuntu-latest, nvim v0.10.0, live-server floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      # Neovim 0.10.0 against the live-server floor is the minimal install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selimacerbas/live-server.nvim
          ref: ${{ env.LIVE_SERVER_FLOOR_SHA }}
          path: live-server-rtp
          persist-credentials: false
      # A moved tag is the supply-chain event this step surfaces: the checkout
      # took the pinned commit, and the tag must still name it. The helper's
      # floor assignment, matched as a whole line, must name the same tag, so a
      # bump that edits one place reds even with the old line left in a comment.
      - name: live-server floor is the pinned tag
        run: |
          if ! grep -qxF "H.live_server_floor = \"$LIVE_SERVER_FLOOR\"" tests/helpers.lua; then
            echo "::error::tests/helpers.lua's H.live_server_floor does not name $LIVE_SERVER_FLOOR"
            exit 1
          fi
          git -C live-server-rtp fetch --depth 1 origin "refs/tags/$LIVE_SERVER_FLOOR:refs/tags/$LIVE_SERVER_FLOOR"
          tagged=$(git -C live-server-rtp rev-parse "$LIVE_SERVER_FLOOR^{commit}")
          if [ "$tagged" != "$LIVE_SERVER_FLOOR_SHA" ]; then
            echo "::error::live-server $LIVE_SERVER_FLOOR names $tagged, not the pinned $LIVE_SERVER_FLOOR_SHA"
            exit 1
          fi
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.10.0
      - name: Version
        run: nvim --version | head -n 3
      # Release builds bundle the markdown parser since 0.10, so this asserts
      # it instead of installing it; a -c Lua error alone would exit 0, so the
      # pcall covers the vim.treesitter lookup as well as the call.
      - name: Assert the markdown Tree-sitter parser
        run: >-
          nvim --headless -u NONE
          -c 'lua local ok, p = pcall(function() return vim.treesitter.get_string_parser("# x", "markdown") end);
          if not (ok and p) then io.stderr:write("markdown parser missing\n"); vim.cmd("cq 1") end'
          -c 'qa!'
      - name: Headless tests
        run: bash tests/run.sh

  # Below the floor on a real Neovim: the suites need 0.10, and floor_guard
  # mocks has() on a supported one, which passes a 0.10 API reached before a
  # guard (measured), so a standalone smoke runs the refusal a 0.9 user meets,
  # with the live-server floor on the runtimepath as a user has it.
  floor-below:
    name: floor-below (ubuntu-latest, nvim v0.9.5, live-server floor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/floor_smoke.sh puts ./live-server-rtp on the runtimepath.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selimacerbas/live-server.nvim
          ref: ${{ env.LIVE_SERVER_FLOOR_SHA }}
          path: live-server-rtp
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.9.5
      - name: Version
        run: nvim --version | head -n 3
      - name: Below-floor smoke
        run: sh tests/floor_smoke.sh

  # A live-server main change that is not this repo's regression must not red
  # every PR, so main is reported here, outside ci-ok, on every push and PR.
  upstream:
    name: upstream (${{ matrix.os }}, live-server main)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # On push and pull_request runs the conclusion follows ci-ok; a red here
    # is read from this job's own conclusion and never blocks a merge.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selimacerbas/live-server.nvim
          ref: main
          path: live-server-rtp
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Version
        run: nvim --version | head -n 3
      - name: Headless tests
        run: bash tests/run.sh

  # Measures the suites on Windows; the token fallback (no /dev/urandom) has
  # no assertion of its own yet. It reports, and joins ci-ok once it has been
  # green. It runs against the live-server floor, as the gating jobs do, so
  # that once it joins them it gates on the floor and not on live-server main.
  windows:
    name: windows (nvim stable, live-server floor)
    runs-on: windows-latest
    timeout-minutes: 15
    # On push and pull_request runs the conclusion follows ci-ok; a red here
    # is read from this job's own conclusion and never blocks a merge.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selimacerbas/live-server.nvim
          ref: ${{ env.LIVE_SERVER_FLOOR_SHA }}
          path: live-server-rtp
          persist-credentials: false
      # A moved tag is the supply-chain event this step surfaces: the checkout
      # took the pinned commit, and the tag must still name it. The helper's
      # floor assignment, matched as a whole line, must name the same tag, so a
      # bump that edits one place reds even with the old line left in a comment.
      - name: live-server floor is the pinned tag
        run: |
          if ! grep -qxF "H.live_server_floor = \"$LIVE_SERVER_FLOOR\"" tests/helpers.lua; then
            echo "::error::tests/helpers.lua's H.live_server_floor does not name $LIVE_SERVER_FLOOR"
            exit 1
          fi
          git -C live-server-rtp fetch --depth 1 origin "refs/tags/$LIVE_SERVER_FLOOR:refs/tags/$LIVE_SERVER_FLOOR"
          tagged=$(git -C live-server-rtp rev-parse "$LIVE_SERVER_FLOOR^{commit}")
          if [ "$tagged" != "$LIVE_SERVER_FLOOR_SHA" ]; then
            echo "::error::live-server $LIVE_SERVER_FLOOR names $tagged, not the pinned $LIVE_SERVER_FLOOR_SHA"
            exit 1
          fi
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Version
        run: nvim --version | head -n 3
      - name: Headless tests
        run: bash tests/run.sh

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: make lint-blame checks that HEAD contains every commit
      # .git-blame-ignore-revs names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: actionlint
        # Dependabot skips docker:// references (dependabot-core's
        # github_actions file_parser returns early on them), so this digest
        # is moved by hand.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: make lint-text
        run: make lint-text
      - name: make lint-blame
        run: make lint-blame

  # The Makefile holds the one StyLua pin; the job runs its target. An exact
  # bun-version needs no GitHub API lookup, so no step here holds the job
  # token.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          token: ""
      - name: make fmt-check
        run: make fmt-check

  # The one status check branch protection is meant to require (an operator
  # step later). Each gating job is named, so an empty or shortened needs list
  # cannot pass.
  ci-ok:
    if: always()
    needs: [test, floor, floor-below, lint-workflows, format]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every gating job succeeded
        env:
          TEST: ${{ needs.test.result }}
          FLOOR: ${{ needs.floor.result }}
          FLOOR_BELOW: ${{ needs.floor-below.result }}
          LINT: ${{ needs.lint-workflows.result }}
          FORMAT: ${{ needs.format.result }}
        run: |
          echo "test=$TEST floor=$FLOOR floor-below=$FLOOR_BELOW lint-workflows=$LINT format=$FORMAT"
          [ "$TEST" = success ] && [ "$FLOOR" = success ] && [ "$FLOOR_BELOW" = success ] && [ "$LINT" = success ] && [ "$FORMAT" = success ]
