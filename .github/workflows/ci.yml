name: ci

on:
  push:
    branches: [main]
  # edited is listed because the title and the body become the squash
  # commit, so an edited pull request is judged again. No branch filter: it
  # would drop every job, so a stacked pull request would get no CI at all.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# The live-server floor the gating jobs and the windows job run against: the
# tag the v1.10.0 release notes promise and the commit it named when pinned.
# The tag is lightweight and could move, so the local action
# .github/actions/live-server-floor checks out the commit, checks that the
# tag still names it and that tests/helpers.lua's H.live_server_floor names
# the same tag; the floor moves by editing these two lines and that one
# together. live-server main is the upstream job's to report.
env:
  LIVE_SERVER_FLOOR: v1.5.0
  LIVE_SERVER_FLOOR_SHA: f98bae79fd30274524412f7514549d84391d6bb2
  # The one bun pin, for the format and browser jobs.
  BUN_VERSION: 1.4.2

concurrency:
  # A PR's superseded run is cancelled; a push and a manual run each get
  # their own group, so no verdict on main is ever cancelled or replaced
  # (GitHub replaces a pending run in a shared group even with
  # cancel-in-progress false).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.nvim }}, live-server floor)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      # A local action runs from the commit under test, so it takes no SHA pin.
      - uses: ./.github/actions/live-server-floor
        with:
          tag: ${{ env.LIVE_SERVER_FLOOR }}
          sha: ${{ env.LIVE_SERVER_FLOOR_SHA }}
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Version
        run: nvim --version | head -n 3
      # Release builds bundle the markdown parser since 0.10, so this asserts
      # it instead of installing it; a -c Lua error alone would exit 0, so the
      # pcall covers the vim.treesitter lookup as well as the call.
      - name: Assert the markdown Tree-sitter parser
        run: >-
          nvim --headless -u NONE
          -c 'lua local ok, p = pcall(function() return vim.treesitter.get_string_parser("# x", "markdown") end);
          if not (ok and p) then io.stderr:write("markdown parser missing\n"); vim.cmd("cq 1") end'
          -c 'qa!'
      # -l exits 1 on a Lua error in the main chunk, where the luafile form the
      # tests once documented exited 0; a failed assertion and an error raised
      # in a callback reach the exit code through
      # H.finish() (tests/helpers.lua).
      - name: Headless tests
        run: bash tests/run.sh
      # One leg is enough for a POSIX sh script with no Neovim in it; it runs
      # after a red suite too, as make test runs both.
      - name: Commit-message policy test
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: sh tests/message_policy_test.sh

  # The floor this plugin requires (the README states it from the floor
  # commit on): the first 0.10 release, not its last patch.
  floor:
    name: floor (ubuntu-latest, nvim v0.10.0, live-server floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      # Neovim 0.10.0 against the live-server floor is the minimal install.
      - uses: ./.github/actions/live-server-floor
        with:
          tag: ${{ env.LIVE_SERVER_FLOOR }}
          sha: ${{ env.LIVE_SERVER_FLOOR_SHA }}
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.10.0
      - name: Version
        run: nvim --version | head -n 3
      # Release builds bundle the markdown parser since 0.10, so this asserts
      # it instead of installing it; a -c Lua error alone would exit 0, so the
      # pcall covers the vim.treesitter lookup as well as the call.
      - name: Assert the markdown Tree-sitter parser
        run: >-
          nvim --headless -u NONE
          -c 'lua local ok, p = pcall(function() return vim.treesitter.get_string_parser("# x", "markdown") end);
          if not (ok and p) then io.stderr:write("markdown parser missing\n"); vim.cmd("cq 1") end'
          -c 'qa!'
      - name: Headless tests
        run: bash tests/run.sh

  # Below the floor on a real Neovim: the suites need 0.10, and floor_guard
  # mocks has() on a supported one, which passes a 0.10 API reached before a
  # guard (measured), so a standalone smoke runs the refusal a 0.9 user meets,
  # with the live-server floor on the runtimepath as a user has it.
  floor-below:
    name: floor-below (ubuntu-latest, nvim v0.9.5, live-server floor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/floor_smoke.sh puts ./live-server-rtp on the runtimepath.
      - uses: ./.github/actions/live-server-floor
        with:
          tag: ${{ env.LIVE_SERVER_FLOOR }}
          sha: ${{ env.LIVE_SERVER_FLOOR_SHA }}
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.9.5
      - name: Version
        run: nvim --version | head -n 3
      - name: Below-floor smoke
        run: sh tests/floor_smoke.sh

  # A live-server main change that is not this repo's regression must not red
  # every PR, so main is reported here, outside ci-ok, on every push and PR.
  upstream:
    name: upstream (${{ matrix.os }}, live-server main)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # On push and pull_request runs the conclusion follows ci-ok; a red here
    # is read from this job's own conclusion and never blocks a merge.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selimacerbas/live-server.nvim
          ref: main
          path: live-server-rtp
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Version
        run: nvim --version | head -n 3
      - name: Headless tests
        run: bash tests/run.sh

  # The suites on Windows, gating as the other test jobs do and on the
  # live-server floor as they are; it joined ci-ok after three green hosted
  # runs. The token fallback (no /dev/urandom) has no assertion of its own.
  windows:
    name: windows (nvim stable, live-server floor)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tests/helpers.lua looks for live-server.nvim at ./live-server-rtp.
      - uses: ./.github/actions/live-server-floor
        with:
          tag: ${{ env.LIVE_SERVER_FLOOR }}
          sha: ${{ env.LIVE_SERVER_FLOOR_SHA }}
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Version
        run: nvim --version | head -n 3
      - name: Headless tests
        run: bash tests/run.sh

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: make lint-blame checks that HEAD contains every commit
      # .git-blame-ignore-revs names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: actionlint
        # Dependabot skips docker:// references (dependabot-core's
        # github_actions file_parser returns early on them), so this digest
        # is moved by hand.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      # The same image by the same digest carries the shellcheck actionlint's
      # own checks run (0.11.0, measured), so the scripts are read by one
      # pinned binary; the digest moves with the one above.
      - name: shellcheck
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          entrypoint: sh
          args: -c "shellcheck -s sh tests/*.sh .githooks/commit-msg .githooks/message-policy"
      - name: make lint-text
        run: make lint-text
      - name: make lint-blame
        run: make lint-blame

  # The Makefile holds the one StyLua pin; the job runs its target. An exact
  # bun-version needs no GitHub API lookup, so no step here holds the job
  # token.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          token: ""
      - name: make fmt-check
        run: make fmt-check

  # The pull request arm judges a contributor's commits, title and body before
  # they land; the push arm reports what already landed on main, a direct push
  # and the merge or squash commit GitHub composes included. A push range it
  # cannot read is noticed, never judged. A manual run judges the commit it
  # runs on, alone. A pull request GitHub's Dependabot
  # opened (keyed on the login GitHub sets, never on a commit's author name,
  # which anyone can write) is machine-authored: its sign-off line is
  # accepted on its commits and its body, release notes, is not judged; the
  # maintainer replaces that body when merging (CONTRIBUTING.md).
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The squash setting makes the title the subject, with " (#N)" appended,
      # and the body the commit body, so the title is at most 65 characters
      # and both are judged as the message they become.
      - name: Pull request title and body
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # ${#TITLE} counts characters, not bytes, only under a UTF-8 locale.
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          fail=0
          if [ "${#TITLE}" -gt 65 ]; then
            printf '::error::the title is %s characters, over 65: %s\n' "${#TITLE}" "$TITLE"
            fail=1
          fi
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            echo "::notice::a Dependabot pull request: the title is judged, the body is not"
            BODY=
          fi
          if out=$(printf '%s\n\n%s\n' "$TITLE" "$BODY" | .githooks/message-policy - 2>&1); then
            rc=0
          else
            rc=$?
          fi
          case $rc in
            0) ;;
            1)
              printf '%s\n' "$out" | sed 's/^/::error::the title or the body (see CONTRIBUTING.md): /'
              fail=1
              ;;
            *)
              printf '::error::the message policy could not judge the title and the body (exit %s): %s\n' "$rc" "$out"
              exit 2
              ;;
          esac
          exit "$fail"
      - name: The message policy on each commit
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # An empty sed script passes every line; Dependabot's one drops
          # its own sign-off line, exactly as it writes it, and nothing else.
          drop=
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            echo "::notice::a Dependabot pull request: its sign-off line is accepted on each commit"
            drop='/^Signed-off-by: dependabot\[bot\] <support@github\.com>$/d'
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "::notice::a manual run names no range; the commit it runs on is judged alone"
            range="$GITHUB_SHA^!"
          elif [ "$EVENT" = pull_request ]; then
            # The test merge's first parent is the base GitHub merged into;
            # pull_request.base.sha goes stale once the branch merges main.
            range="$(git rev-parse "$GITHUB_SHA^1")..$PR_HEAD"
          else
            # Empty or all zeros is a push with no earlier tip; a tip missing
            # from the clone was dropped by a force push.
            case $BEFORE in
              *[!0]*) ;;
              *)
                echo "::notice::no earlier tip on this push; nothing judged"
                exit 0
                ;;
            esac
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "::notice::the earlier tip $BEFORE is not in the clone; nothing judged"
              exit 0
            fi
            if ! base=$(git merge-base "$BEFORE" "$GITHUB_SHA"); then
              echo "::notice::$BEFORE and $GITHUB_SHA share no history; nothing judged"
              exit 0
            fi
            range="$base..$GITHUB_SHA"
          fi
          count=$(git rev-list --count "$range")
          if [ "$count" -eq 0 ]; then
            if [ "$EVENT" = pull_request ]; then
              echo "::error::the pull request range $range holds no commit"
              exit 1
            fi
            # A rewind or a re-push of the same tip lands no new commit.
            echo "::notice::no new commit in $range; nothing judged"
            exit 0
          fi
          echo "judging $count commits in $range"
          shas=$(git rev-list --reverse "$range")
          fail=0
          for sha in $shas; do
            if out=$(git show -s --format=%B "$sha" | sed "$drop" | .githooks/message-policy - 2>&1); then
              continue
            else
              rc=$?
            fi
            name=$(git show -s --format='%h %s' "$sha")
            if [ "$rc" -ne 1 ]; then
              printf '::error::%s: the message policy could not judge it (exit %s): %s\n' "$name" "$rc" "$out"
              exit 2
            fi
            printf '%s\n' "$out" | while IFS= read -r line; do
              printf '::error::%s (see CONTRIBUTING.md): %s\n' "$name" "$line"
            done
            fail=1
          done
          exit "$fail"

  # The page itself: tests/browser/smoke.test.ts renders a buffer in a
  # headless Chromium and follows one edit over SSE. The CDN libraries the
  # page loads need network, and a failed request is named in the output.
  browser:
    name: browser (ubuntu-latest, nvim stable, chromium, live-server floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The smoke test looks for live-server.nvim at ./live-server-rtp.
      - uses: ./.github/actions/live-server-floor
        with:
          tag: ${{ env.LIVE_SERVER_FLOOR }}
          sha: ${{ env.LIVE_SERVER_FLOOR_SHA }}
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Version
        run: nvim --version | head -n 3
      # The job token stays out of this third-party action: an exact version needs none.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          token: ""
      # Without the lock, --frozen-lockfile resolves from the registry.
      - name: Install
        working-directory: tests/browser
        run: |
          test -f bun.lock || { echo "::error::tests/browser/bun.lock is missing"; exit 1; }
          bun install --frozen-lockfile
      # The headless test launches the headless shell only.
      - name: Chromium
        working-directory: tests/browser
        run: bun x playwright install --with-deps --only-shell chromium
      # bun exits 0 when every test is skipped, so the JUnit report's counts
      # rule: one test, none failed, none skipped.
      - name: Smoke test
        working-directory: tests/browser
        run: |
          bun test --reporter=junit --reporter-outfile="$RUNNER_TEMP/smoke.xml"
          line=$(grep '<testsuites ' "$RUNNER_TEMP/smoke.xml")
          for want in 'tests="1"' 'failures="0"' 'skipped="0"'; do
            case $line in
              *" $want "*) ;;
              *) echo "::error::the smoke test report does not read $want: $line"; exit 1 ;;
            esac
          done

  # The one status check branch protection requires, strict, on both
  # repositories. Its context is this job's id, so renaming the job or giving
  # it a name: leaves every pull request waiting on a check that never
  # reports. Each gating job is named, so an empty or shortened needs list
  # cannot pass. Each check line ends in exit 1: under bash -e a failed test
  # inside an && list does not stop the script, so a later line that passed
  # would pass a red run (measured). commits runs on every event, so a manual
  # run of a pull request's head posts no green ci-ok that judged no commit.
  ci-ok:
    if: always()
    needs: [test, floor, floor-below, windows, lint-workflows, format, commits, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every gating job succeeded
        env:
          EVENT: ${{ github.event_name }}
          TEST: ${{ needs.test.result }}
          FLOOR: ${{ needs.floor.result }}
          FLOOR_BELOW: ${{ needs.floor-below.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINT: ${{ needs.lint-workflows.result }}
          FORMAT: ${{ needs.format.result }}
          COMMITS: ${{ needs.commits.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "event=$EVENT test=$TEST floor=$FLOOR floor-below=$FLOOR_BELOW windows=$WINDOWS lint-workflows=$LINT format=$FORMAT commits=$COMMITS browser=$BROWSER"
          [ "$COMMITS" = success ] || exit 1
          [ "$TEST" = success ] && [ "$FLOOR" = success ] && [ "$FLOOR_BELOW" = success ] && [ "$WINDOWS" = success ] && [ "$LINT" = success ] && [ "$FORMAT" = success ] && [ "$BROWSER" = success ] || exit 1
