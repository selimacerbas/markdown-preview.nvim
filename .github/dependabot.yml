version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows and a root action.yml only, so the local
    # action's pinned checkout is listed for its bumps too.
    directories:
      - /
      - /.github/actions/live-server-floor
    schedule:
      interval: weekly
    # A hijacked or broken action release gets a week to be caught before a
    # bump PR proposes it.
    cooldown:
      default-days: 7
  # Bumps the exact Playwright pin: Dependabot's bun support is version updates only.
  - package-ecosystem: bun
    directory: /tests/browser
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
